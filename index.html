<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>STJ Family Home | Staff Reporting</title><style>
:root{--nav:#142b30;--green:#176b59;--ink:#1d3033;--muted:#6b7c80;--line:#dce5e3;--bg:#f2f6f5}*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui, sans-serif;background:var(--bg);color:var(--ink)}button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:wait}.shell{min-height:100vh;display:grid;grid-template-columns:258px 1fr}.side{background:var(--nav);color:#fff;padding:28px 18px;display:flex;flex-direction:column;gap:24px}.brand{display:flex;align-items:center;gap:12px;padding:0 7px}.mark{width:44px;height:44px;border:1px solid #d5b77b;border-radius:12px;display:grid;place-items:center;color:#e2c88e;font-family:Georgia,serif;font-size:22px}.brand strong{font-size:15px;letter-spacing:1px}.brand small{display:block;color:#b9ccca;font-size:11px}.nav-label{font-size:11px;letter-spacing:1.4px;color:#a0b9b6;padding:0 12px}.nav{display:grid;gap:5px}.nav button{background:none;border:0;color:#dbe7e4;text-align:left;padding:12px;border-radius:9px;display:flex;gap:12px;align-items:center}.nav button.active,.nav button:hover{background:#28534f;color:white}.side-foot{margin-top:auto;color:#b4c9c6;font-size:12px;padding:10px}.main{min-width:0}.top{display:flex;justify-content:space-between;align-items:center;background:white;border-bottom:1px solid var(--line);padding:15px 30px;gap:12px}.top strong{font-size:14px}.top small{display:block;color:var(--muted)}.menu{display:none}.content{max-width:1050px;margin:auto;padding:30px}.eyebrow{color:var(--green);letter-spacing:1.4px;font-size:11px;font-weight:750;text-transform:uppercase}h1{font-size:clamp(25px,4vw,34px);line-height:1.15;letter-spacing:-.8px;margin:8px 0}h2{font-size:18px;margin:0 0 5px}p{margin:0 0 13px;color:var(--muted)}.notice{border:1px solid #e0d4b7;background:#fffaf0;color:#67522a;border-radius:10px;padding:12px 15px;margin:19px 0;font-size:13px}.card{border:1px solid var(--line);background:white;border-radius:15px;padding:23px;margin:18px 0;box-shadow:0 4px 20px #14302d07}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.full{grid-column:1/-1}label{display:block;font-size:13px;font-weight:650;margin-bottom:6px}input,select,textarea{width:100%;padding:11px 12px;border:1px solid #cddbd8;border-radius:8px;background:white;color:var(--ink);min-width:0}input:focus,select:focus,textarea:focus{outline:2px solid #8bc5b6;outline-offset:1px}textarea{min-height:94px;resize:vertical}.primary,.secondary,.danger{border:0;border-radius:9px;padding:11px 16px;font-weight:650}.primary{background:var(--green);color:white}.secondary{background:#e8f0ed;color:var(--ink)}.danger{background:#f8e4e0;color:#9a3224}.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:22px}.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.tile{border:1px solid var(--line);background:white;border-radius:13px;padding:18px;text-align:left;color:var(--ink)}.tile span{display:block;color:var(--green);font-size:24px;margin-bottom:8px}.tile strong{display:block}.tile small{color:var(--muted)}.stat{font-size:29px;font-weight:700;display:block}.pill{display:inline-block;padding:4px 9px;background:#e8f1ee;border-radius:20px;font-size:12px}.record{border-top:1px solid var(--line);padding:15px 0}.record:first-of-type{border-top:0}.record-head{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.record pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit;background:#f6f9f8;border-radius:9px;padding:12px}.hint{font-size:12px;color:var(--muted)}.status{margin-top:14px;white-space:pre-wrap}.error{color:#a52a20}.success{color:var(--green)}.login{max-width:440px;margin:10vh auto;padding:20px}.hide{display:none!important}.item-row{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:8px;align-items:end;margin-bottom:10px}.item-row button{padding:11px}.muted{color:var(--muted)}@media(max-width:750px){.shell{grid-template-columns:1fr}.side{display:none;position:fixed;inset:0 auto 0 0;width:260px;z-index:10;box-shadow:0 0 0 100vmax #0005}.side.open{display:flex}.menu{display:inline-block}.top{padding:12px 16px}.content{padding:20px 14px}.grid,.tiles{grid-template-columns:1fr}.card{padding:17px}.item-row{grid-template-columns:1fr 1fr}.item-row>div:first-child{grid-column:1/-1}.item-row button{grid-column:1/-1}.top .hint{display:none}} </style></head><body>
<div id="login" class="login hide"><div class="card"><div class="eyebrow">STJ Family Home</div><h1>Staff sign in</h1><p>Use your assigned account to access the portal.</p><form id="loginForm" class="grid"><div class="full"><label for="user">Username</label><input id="user" autocomplete="username" required></div><div class="full"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required></div><button class="primary full">Sign in</button></form><div id="loginStatus" class="status" role="status"></div></div></div>
<div id="shell" class="shell hide"><aside id="side" class="side"><div class="brand"><div class="mark">S</div><div><strong>STJ FAMILY HOME</strong><small>STAFF REPORTING PORTAL</small></div></div><div><div class="nav-label">WORKSPACE</div><nav class="nav" aria-label="Main navigation" id="nav"></nav></div><div class="side-foot">Operations & management<br>Internal staff workspace</div></aside><main class="main"><header class="top"><div class="actions" style="margin:0"><button class="secondary menu" id="menuBtn" aria-label="Open menu">☰</button><div><strong id="identity">Staff workspace</strong><small id="today"></small></div></div><div class="actions" style="margin:0"><span class="hint" id="modeLabel"></span><button class="secondary" id="accountBtn"></button></div></header><div class="content" id="content"></div></main></div>
<script>
'use strict';
const demo=location.protocol==='file:'||new URLSearchParams(location.search).has('demo');const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const dateNow=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'Africa/Lagos',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());const labels={daily:'Daily operations report',requisition:'Requisition request',incident:'Incident & maintenance report'};let identity=null,page='home',records=[],demoManager=false;const storeKey='stj-demo-records-v1';let demoRecords=[];try{demoRecords=JSON.parse(localStorage.getItem(storeKey)||'[]')}catch{};let phone='';try{phone=localStorage.getItem('stj-demo-phone')||''}catch{};
async function api(path,method='GET',body){const r=await fetch('/api/'+path,{method,headers:{'Content-Type':'application/json'},...(body?{body:JSON.stringify(body)}:{})});const j=await r.json();if(!r.ok)throw Error(j.error||'Request failed');return j}
function saveDemo(){try{localStorage.setItem(storeKey,JSON.stringify(demoRecords))}catch{}}
function showShell(){ $('login').classList.add('hide');$('shell').classList.remove('hide');$('identity').textContent=identity.name+' · '+(identity.role==='manager'?'Manager':'Staff');$('today').textContent=new Intl.DateTimeFormat('en-NG',{dateStyle:'full',timeZone:'Africa/Lagos'}).format(new Date());$('modeLabel').textContent=demo?'Local demonstration':'Staff workspace';$('accountBtn').textContent=demo?(demoManager?'Staff view':'Manager view'):'Sign out';render()}
const navItems=[['home','⌂','Overview'],['daily','▤','Daily operations'],['requisition','▣','Requisitions'],['incident','△','Incidents & maintenance'],['history','◷','Submissions']];function go(p){page=p;$('side').classList.remove('open');render()};function header(k,t,d){return `<div class="eyebrow">${k}</div><h1>${t}</h1><p>${d}</p>`}function banner(){return demo?'<div class="notice"><strong>Demo mode.</strong> Records stay on this browser only. Do not enter real guest or sensitive staff details. WhatsApp opens a prepared message; press Send to deliver it.</div>':''}
function field(n,l,type='text',required=false,placeholder=''){return `<div><label for="${n}">${l}${required?' *':''}</label><input id="${n}" name="${n}" type="${type}" ${required?'required':''} ${type==='number'?'min="0" step="0.01"':''} ${type==='date'&&required?`value="${esc(dateNow())}"`:''} placeholder="${esc(placeholder)}"></div>`}function area(n,l,required=false,placeholder=''){return `<div class="full"><label for="${n}">${l}${required?' *':''}</label><textarea id="${n}" name="${n}" ${required?'required':''} maxlength="2000" placeholder="${esc(placeholder)}"></textarea></div>`}function select(n,l,opts,required=true){return `<div><label for="${n}">${l}${required?' *':''}</label><select name="${n}" id="${n}" ${required?'required':''}><option value="">Select</option>${opts.map(o=>`<option>${esc(o)}</option>`).join('')}</select></div>`}function itemRow(){return `<div class="item-row"><div><label>Item / service *</label><input name="item" required maxlength="150" placeholder="e.g. Generator fuel"></div><div><label>Quantity *</label><input name="qty" required maxlength="60" placeholder="20 litres"></div><div><label>Est. cost (₦) *</label><input name="cost" type="number" min="0" step="0.01" required placeholder="0"></div><button type="button" class="secondary remove">Remove</button></div>`}
function render(){ $('nav').innerHTML=navItems.map(([p,i,t])=>`<button data-page="${p}" class="${page===p?'active':''}"><span aria-hidden="true">${i}</span>${t}</button>`).join('');$('nav').querySelectorAll('button').forEach(b=>b.onclick=()=>go(b.dataset.page));let c=$('content');if(page==='home'){c.innerHTML=header('Operations workspace','Reporting centre','Select a form to submit an operational update to management.')+banner()+`<div class="tiles">${navItems.slice(1,4).map(([p,i,t])=>`<button class="tile" data-page="${p}"><span>${i}</span><strong>${t}</strong><small>${({daily:'Activities, power and handover',requisition:'Supplies, purchases and funds',incident:'Faults, complaints and urgent issues'})[p]}</small></button>`).join('')}</div><div class="card"><h2>${identity.role==='manager'?'Management review':'Your submissions'}</h2><p>Review reports and track requisition decisions.</p><button class="secondary" data-page="history">View submissions →</button></div>`;c.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page));return}if(page==='history'){c.innerHTML=header('Records',identity.role==='manager'?'Management review':'Submission history','View saved reports, delivery status and requisition decisions.')+banner()+`<div class="card"><div class="grid"><div><label for="filter">Filter by type</label><select id="filter"><option value="all">All submissions</option>${Object.entries(labels).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></div><div><label for="search">Search</label><input id="search" placeholder="Reference or keyword"></div></div><div id="records" style="margin-top:18px" aria-live="polite">Loading…</div></div>`;$('filter').onchange=drawRecords;$('search').oninput=drawRecords;loadRecords();return}
let fields=field('date','Report date','date',true);if(demo)fields+=field('staff','Staff name','text',true,'e.g. Emmanuel');if(page==='daily'){fields+=select('shift','Duty period',['Active duty','Standby / handover','Other'])+area('activities','Activities completed',true,'Laundry, housekeeping, guest services…')+select('power','Power supply status',['Normal','Solar outage','Generator in use','Grid outage','Other'])+field('fuel','Generator fuel level / usage','text',false,'e.g. 20 litres remaining')+area('rooms','Room / occupancy updates',false,'Use room numbers only; do not include guest names.')+area('outstanding','Outstanding tasks',false,'Enter Nil if none.')+area('notes','Additional notes')}
if(page==='requisition'){fields+=select('department','Department',['Operations','Housekeeping','Front desk','Bar / sales','Maintenance','Other'])+select('priority','Priority',['Routine','Urgent','Critical'])+`<div class="full"><h2>Requested items</h2><p class="hint">Add each item and its estimated cost.</p><div id="items">${itemRow()}</div><button type="button" class="secondary" id="addItem">+ Add item</button><div style="margin-top:12px"><strong>Total estimated: <span id="total">₦0.00</span></strong></div></div>`+area('reason','Purpose / justification',true)+field('needed','Required by','date',false)+area('notes','Additional notes')}
if(page==='incident'){fields+=select('category','Incident category',['Power / generator / solar','Maintenance / equipment','Security','Guest complaint','Safety','Other'])+select('severity','Severity',['Low','Moderate','High','Critical'])+field('location','Location / room','text',true)+field('time','Time of incident','time',true)+area('description','Incident description',true)+area('action','Immediate action taken',true)+area('followup','Assistance / follow-up required')}
c.innerHTML=header('New submission',labels[page],'Complete the required fields. Fields marked * are mandatory.')+banner()+`<form id="reportForm" class="card"><div class="grid">${fields}</div>${demo?`<div style="margin-top:18px"><label for="phone">Manager’s WhatsApp number (optional for saving demo)</label><input id="phone" type="tel" placeholder="234… (international format)" value="${esc(phone)}"><p class="hint">Set a number to open a pre-filled WhatsApp message after saving.</p></div>`:''}<div class="actions"><button class="primary" id="submitBtn" type="submit">${demo?'Save & prepare WhatsApp':'Submit to management'}</button><button class="secondary" type="button" id="cancel">Cancel</button></div><div id="formStatus" class="status" role="status"></div></form>`;$('cancel').onclick=()=>go('home');$('reportForm').onsubmit=submit;if(page==='requisition'){const items=$('items');const update=()=>{$('total').textContent=money([...items.querySelectorAll('[name=cost]')].reduce((s,i)=>s+Number(i.value||0),0));items.querySelectorAll('.remove').forEach(b=>b.disabled=items.children.length===1)};items.oninput=update;items.onclick=e=>{if(e.target.classList.contains('remove')&&items.children.length>1){e.target.closest('.item-row').remove();update()}};$('addItem').onclick=()=>{items.insertAdjacentHTML('beforeend',itemRow());update()};update()}}
const money=n=>new Intl.NumberFormat('en-NG',{style:'currency',currency:'NGN'}).format(n);const fieldNames={date:'Report date',staff:'Staff',shift:'Duty period',activities:'Activities completed',power:'Power status',fuel:'Fuel',rooms:'Room updates',outstanding:'Outstanding tasks',notes:'Notes',department:'Department',priority:'Priority',reason:'Purpose',needed:'Required by',category:'Category',severity:'Severity',location:'Location',time:'Time',description:'Description',action:'Action taken',followup:'Follow-up'};function message(r){let lines=['STJ FAMILY HOME',labels[r.type].toUpperCase(),'Reference: '+r.id,'Submitted by: '+r.staff];for(const [k,v] of Object.entries(r.data)){if(k==='staff'||k==='items'||!v)continue;lines.push((fieldNames[k]||k)+': '+v)}if(r.data.items){lines.push('Items:');r.data.items.forEach(i=>lines.push('• '+i.item+' — '+i.qty+' — '+money(i.cost)));lines.push('Total estimated: '+money(r.data.items.reduce((s,i)=>s+Number(i.cost),0)))}return lines.join('\n')}
async function submit(e){e.preventDefault();const f=e.currentTarget,b=$('submitBtn'),s=$('formStatus'),type=page;let data=Object.fromEntries(new FormData(f));if(type==='requisition'){data.items=[...$('items').querySelectorAll('.item-row')].map(r=>({item:r.querySelector('[name=item]').value.trim(),qty:r.querySelector('[name=qty]').value.trim(),cost:Number(r.querySelector('[name=cost]').value)}));delete data.item;delete data.qty;delete data.cost}b.disabled=true;s.className='status';s.textContent='Saving…';try{if(demo){phone=$('phone').value.replace(/[^0-9]/g,'');if(phone&&!/^[1-9][0-9]{7,14}$/.test(phone))throw Error('Enter a valid international WhatsApp number, without a leading zero.');try{localStorage.setItem('stj-demo-phone',phone)}catch{}const r={id:type.slice(0,3).toUpperCase()+'-'+Date.now().toString(36).toUpperCase(),type,staff:data.staff,data,status:type==='requisition'?'Pending':'Submitted',notification:'Not sent (demo)',created_at:new Date().toISOString()};demoRecords.unshift(r);saveDemo();s.className='status success';s.textContent='Saved in this browser: '+r.id;const a=document.createElement('a');a.className='primary';a.style.display='inline-block';a.style.marginTop='12px';a.textContent='Open WhatsApp to send';a.href='https://wa.me/'+phone+'?text='+encodeURIComponent(message(r));a.target='_blank';a.rel='noopener noreferrer';s.append(document.createElement('br'),a);b.disabled=true;return}const r=await api('submit','POST',{type,data});s.className='status success';s.textContent='Saved: '+r.id+'. WhatsApp: '+r.notification+'.';b.disabled=true;return}catch(err){s.className='status error';s.textContent=err.message;b.disabled=false}}
async function loadRecords(){try{records=demo?demoRecords:(await api('records')).records;drawRecords()}catch(e){if($('records'))$('records').textContent=e.message}}function drawRecords(){if(!$('records'))return;const filter=$('filter').value,q=$('search').value.toLowerCase();const rows=records.filter(r=>(filter==='all'||r.type===filter)&&message(r).toLowerCase().includes(q));$('records').innerHTML=rows.length?rows.map(r=>`<article class="record"><div class="record-head"><strong>${esc(labels[r.type])} · ${esc(r.id)}</strong><span class="pill">${esc(r.status)}</span></div><p class="hint">${esc(r.staff)} · WhatsApp: ${esc(r.notification)}</p><details><summary>View details</summary><pre>${esc(message(r))}</pre></details>${identity.role==='manager'&&r.type==='requisition'&&r.status==='Pending'?`<div class="actions"><button class="primary decision" data-id="${esc(r.id)}" data-value="Approved">Approve</button><button class="danger decision" data-id="${esc(r.id)}" data-value="Declined">Decline</button></div>`:''}</article>`).join(''):'<p>No matching submissions.</p>';$('records').querySelectorAll('.decision').forEach(b=>b.onclick=async()=>{if(!confirm(b.dataset.value+' this requisition?'))return;b.disabled=true;try{if(demo){demoRecords.find(r=>r.id===b.dataset.id).status=b.dataset.value;saveDemo()}else await api('decision','POST',{id:b.dataset.id,status:b.dataset.value});await loadRecords()}catch(e){alert(e.message);b.disabled=false}})}
$('menuBtn').onclick=()=>$('side').classList.toggle('open');$('accountBtn').onclick=async()=>{if(demo){demoManager=!demoManager;identity={name:demoManager?'Demo manager':'Demo staff',role:demoManager?'manager':'staff'};showShell()}else{await api('logout','POST',{});location.reload()}};$('loginForm').onsubmit=async e=>{e.preventDefault();try{identity=await api('login','POST',{username:$('user').value,password:$('password').value});showShell()}catch(err){$('loginStatus').textContent=err.message}};if(demo){identity={name:'Demo staff',role:'staff'};showShell()}else{api('me').then(r=>{identity=r;showShell()}).catch(()=>$('login').classList.remove('hide'))}
</script></body></html>
